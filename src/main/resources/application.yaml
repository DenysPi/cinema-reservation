spring:
  application:
    name: cinema-reservation
  datasource:
    url: jdbc:postgresql://localhost:5432/cinema
    username: cinema
    password: cinema
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379
  
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8081
  tomcat:
    accept-count: 1000